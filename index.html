<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Lector de código - Inventario FSI</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f6f8;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    #lector {
      width: 100%;
      margin-top: 20px;
    }

    #mensaje {
      margin-top: 20px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>📷 LECTOR DE CÓDIGO</h1>

    <div id="lector"></div>

    <div id="mensaje">
      Iniciando cámara...
    </div>

  </div>

  <script>

 const appUrl =
  "https://script.google.com/macros/s/AKfycbzatHHrplP6lJEuWB_TU2wDrLKuClapzuNItpM8uGJGs5-bxCwlk9y5OQSLEZkaicXe/exec";
    let lector;
    let codigoDetectado = false;


    function iniciarCamara() {

      lector = new Html5Qrcode("lector");

      const configuracion = {
        fps: 10,
        qrbox: {
          width: 280,
          height: 150
        }
      };


      lector.start(
        {
          facingMode: "environment"
        },

        configuracion,

        function(codigo) {

          // Evitar que el mismo código se procese varias veces
          if (codigoDetectado) {
            return;
          }

          codigoDetectado = true;

          document.getElementById("mensaje").textContent =
            "Código detectado: " + codigo;


lector.stop().then(function() {

  // Enviar el código a Inventario FSI
  if (window.opener) {
    window.opener.postMessage(
      {
        tipo: "codigoBarras",
        codigo: codigo
      },
      "*"
    );

    window.close();
  }

}).catch(function(error) {

  console.error(error);

  // Aunque haya un error al detener la cámara,
  // enviamos igualmente el código a Inventario FSI
  if (window.opener) {
    window.opener.postMessage(
      {
        tipo: "codigoBarras",
        codigo: codigo
      },
      "*"
    );

    window.close();
  }

});

        },

        function(error) {

          // Continúa buscando.
          // No mostramos errores mientras está escaneando.

        }

      ).catch(function(error) {

        document.getElementById("mensaje").textContent =
          "No se pudo abrir la cámara. Verifique el permiso de cámara.";

        console.error(error);

      });

    }


 

});
  </script>

</body>

</html>
